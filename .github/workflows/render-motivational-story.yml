name: Render 3D cinematic film

on:
  workflow_dispatch:
    inputs:
      render_length:
        description: 'Preview 12 seconds or complete 10-minute film'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - full
  push:
    branches:
      - feature/motivational-story-remotion-20261118
    paths:
      - 'motivational-video/**'
      - '.github/workflows/render-motivational-story.yml'

permissions:
  contents: read

concurrency:
  group: cinematic-3d-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libgl1-mesa-dri libegl1 libgbm1 libnss3 libxkbcommon0 libasound2t64
      - name: Install React 3D and Remotion
        working-directory: motivational-video
        run: |
          npm install --no-audit --no-fund
          python -m pip install 'edge-tts>=6.1,<8'
      - name: Generate narrated dialogue
        working-directory: motivational-video
        run: python scripts/voice.py
      - name: Install compatible Chromium
        working-directory: motivational-video
        run: npx remotion browser ensure
      - name: Render animated cinematic preview
        if: github.event_name == 'push' || inputs.render_length != 'full'
        working-directory: motivational-video
        run: npm run preview
      - name: Upload animated preview
        if: github.event_name == 'push' || inputs.render_length != 'full'
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-3d-preview
          path: motivational-video/out/cinematic-preview.mp4
          if-no-files-found: error
          retention-days: 14
      - name: Render full ten-minute animated film
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.render_length == 'full')
        working-directory: motivational-video
        run: npm run render
      - name: Inspect MP4 output
        run: |
          find motivational-video/out -name '*.mp4' -type f -print
          for video in motivational-video/out/*.mp4; do
            ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$video"
          done
      - name: Upload complete 10-minute film
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.render_length == 'full')
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-3d-full
          path: motivational-video/out/cinematic-film-10min.mp4
          if-no-files-found: error
          retention-days: 14
